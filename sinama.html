<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerok — kendini sına</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 18px 16px 60px;
    background: #12100e; color: #f0ebe5;
    font: 15px/1.5 -apple-system, system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .alt { color: #a09488; font-size: 13.5px; margin-bottom: 18px; }
  button {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: #e0a458; color: #1a1410; font: 600 17px system-ui; margin-bottom: 16px;
  }
  .satir {
    display: flex; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid #38322e; align-items: flex-start;
  }
  .im { width: 22px; flex-shrink: 0; font-size: 16px; }
  .ad { flex: 1; }
  .not { color: #a09488; font-size: 12.5px; margin-top: 2px; word-break: break-word; }
  .iyi { color: #7ba05b; }
  .kotu { color: #d9634f; }
  .orta { color: #e0a458; }
  #ozet { margin-top: 18px; font-weight: 600; }
</style>
</head>
<body>

<h1>Gerok kendini sınıyor</h1>
<div class="alt">Bu sayfa uygulamanın telefonda gerçekten çalışıp çalışmadığını
ölçer. Ses kaydı, dosya saklama, harita ve yazı tipleri tek tek denenir.
Uygulamanın verisine dokunmaz — kendi geçici dosyasını yazıp siler.</div>

<button id="basla">Sınamayı başlat</button>
<div id="sonuc"></div>
<div id="ozet"></div>

<script type="module">
import * as depo from './js/depo.js';

const sonuc = document.getElementById('sonuc');
let iyi = 0, kotu = 0;

function yaz(durum, ad, not = '') {
  const im = { iyi: '✓', kotu: '✕', orta: '!' }[durum];
  const d = document.createElement('div');
  d.className = 'satir';
  d.innerHTML = `<div class="im ${durum}">${im}</div>
    <div class="ad">${ad}${not ? `<div class="not">${not}</div>` : ''}</div>`;
  sonuc.appendChild(d);
  if (durum === 'iyi') iyi++;
  if (durum === 'kotu') kotu++;
}

// Mikrofon istemeden gerçek bir ses akışı üretir: iOS'ta izin penceresi
// çıkmasın diye. MediaRecorder açısından mikrofondan farkı yok.
function sahteAkis(ac) {
  const hedef = ac.createMediaStreamDestination();
  const osc = ac.createOscillator();
  const kazanc = ac.createGain();
  kazanc.gain.value = 0.25;
  osc.frequency.value = 440;
  osc.connect(kazanc); kazanc.connect(hedef);
  osc.start();
  return hedef.stream;
}

function bicimSec() {
  for (const b of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']) {
    if (window.MediaRecorder?.isTypeSupported?.(b)) return b;
  }
  return '';
}

// Sesi gerçekten çalar ve sonuna kadar gidip gitmediğini ölçer.
function calmayiDene(url, beklenenSn) {
  return new Promise((tamam) => {
    const a = new Audio();
    a.src = url;
    let bitti = false;
    const kapat = (sonuc) => { if (!bitti) { bitti = true; a.pause(); tamam(sonuc); } };

    a.onended = () => kapat({ oldu: a.currentTime >= beklenenSn - 1.2, gecen: a.currentTime, sebep: 'bitti' });
    a.onerror = () => kapat({ oldu: false, gecen: 0, sebep: 'hata kodu ' + (a.error?.code ?? '?') });
    a.play().catch(h => kapat({ oldu: false, gecen: 0, sebep: 'play reddedildi: ' + h.name }));
    setTimeout(() => kapat({ oldu: false, gecen: a.currentTime, sebep: 'zaman aşımı' }), (beklenenSn + 4) * 1000);
  });
}

async function sina() {
  sonuc.innerHTML = ''; iyi = 0; kotu = 0;
  document.getElementById('ozet').textContent = 'sınanıyor…';
  const KAYIT_SN = 3;

  // 1) Depolama yolu
  const yol = await depo.yolSec();
  yaz('iyi', `Depolama yolu: ${yol.toUpperCase()}`,
    yol === 'opfs' ? 'Dosya sistemi kullanılıyor' : 'IndexedDB kullanılıyor');

  // 2) Kalıcı depolama
  const kalici = navigator.storage?.persisted ? await navigator.storage.persisted() : false;
  yaz(kalici ? 'iyi' : 'orta', `Kalıcı depolama: ${kalici ? 'evet' : 'hayır'}`,
    kalici ? '' : 'Yer daralırsa iOS verileri silebilir. Uygulamayı ana ekrandan aç.');

  // 3) Ses kaydı
  if (!window.MediaRecorder) { yaz('kotu', 'MediaRecorder yok', 'Bu tarayıcı ses kaydedemez.'); return bitir(); }
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume().catch(() => {});
  const bicim = bicimSec();
  yaz(bicim ? 'iyi' : 'orta', `Ses biçimi: ${bicim || 'varsayılan'}`);

  let blob;
  try {
    const kaydedici = new MediaRecorder(sahteAkis(ac), bicim ? { mimeType: bicim } : undefined);
    const parcalar = [];
    kaydedici.ondataavailable = (e) => { if (e.data.size) parcalar.push(e.data); };
    kaydedici.start();
    await new Promise(r => setTimeout(r, KAYIT_SN * 1000));
    blob = await new Promise(t => { kaydedici.onstop = () => t(new Blob(parcalar, { type: kaydedici.mimeType })); kaydedici.stop(); });
    kaydedici.stream.getTracks().forEach(i => i.stop());
    yaz(blob.size > 1000 ? 'iyi' : 'kotu', `${KAYIT_SN} saniye ses kaydedildi`, `${blob.size} bayt · ${blob.type || 'türsüz'}`);
  } catch (h) {
    yaz('kotu', 'Ses kaydedilemedi', h.message); return bitir();
  }

  // 4) Yazma ve geri okuma
  const ad = 'sinama-' + Date.now();
  await depo.yaz('sinama', ad, blob);
  const geri = await depo.oku('sinama', ad);
  yaz(geri && geri.size === blob.size ? 'iyi' : 'kotu', 'Dosya yazıldı ve geri okundu',
    `${geri?.size ?? 0} / ${blob.size} bayt`);

  // 5) Saklanan dosyanın türü — asıl tuzak burası
  const turBos = !geri?.type;
  yaz(turBos ? 'orta' : 'iyi', `Saklanan dosyanın türü: ${geri?.type || 'BOŞ'}`,
    turBos ? 'OPFS içerik türü saklamıyor — tür geri yazılmazsa Safari sesi çözemez.' : '');

  // 6) Türsüz adresle çalma (eski davranış)
  const turIyi = blob.type || bicim || 'audio/mp4';
  const urlTursuz = URL.createObjectURL(geri);
  const a1 = await calmayiDene(urlTursuz, KAYIT_SN);
  URL.revokeObjectURL(urlTursuz);
  yaz(a1.oldu ? 'iyi' : 'orta', `Tür yazılmadan çalma: ${a1.oldu ? 'çaldı' : 'ÇALMADI'}`,
    `${a1.gecen.toFixed(1)} sn · ${a1.sebep}`);

  // 7) Tür yazılarak çalma (uygulamanın yaptığı)
  const urlTurlu = await depo.url('sinama', ad, turIyi);
  const a2 = await calmayiDene(urlTurlu, KAYIT_SN);
  URL.revokeObjectURL(urlTurlu);
  yaz(a2.oldu ? 'iyi' : 'kotu', `Tür yazılarak çalma: ${a2.oldu ? 'çaldı' : 'ÇALMADI'}`,
    `${a2.gecen.toFixed(1)} sn · ${a2.sebep}`);

  // 8) Yedek yol: dosyayı baştan çöz
  try {
    const tampon = await ac.decodeAudioData(await geri.arrayBuffer());
    const kaynak = ac.createBufferSource();
    kaynak.buffer = tampon; kaynak.connect(ac.destination);
    const bitis = new Promise(t => { kaynak.onended = t; setTimeout(t, (KAYIT_SN + 3) * 1000); });
    kaynak.start();
    await bitis;
    const dogru = Math.abs(tampon.duration - KAYIT_SN) < 1.2;
    yaz(dogru ? 'iyi' : 'orta', 'Yedek yol (baştan çözme): çaldı',
      `çözülen süre ${tampon.duration.toFixed(1)} sn`);
  } catch (h) {
    yaz('kotu', 'Yedek yol çalışmadı', h.message);
  }

  await depo.sil('sinama', ad);

  // 9) Harita
  try {
    const { haritaVarMi } = await import('./js/harita.js');
    const boyut = await haritaVarMi();
    yaz(boyut ? 'iyi' : 'kotu', `Offline harita: ${boyut ? (boyut / 1048576).toFixed(0) + ' MB hazır' : 'YOK'}`,
      boyut ? '' : 'Gerok sekmesinden ev wifi\'sinde indir.');
  } catch (h) { yaz('kotu', 'Harita sorgulanamadı', h.message); }

  // 10) Yazı tipleri — bunlar olmadan haritada tek bir yer adı görünmez
  let eksik = 0;
  for (const t of ['noto-regular', 'noto-medium']) {
    for (const r of ['0-255', '256-511', '512-767', '768-1023', '1024-1279', '7680-7935', '8192-8447', '8448-8703']) {
      const y = await fetch(`yazi/${t}/${r}.pbf`, { method: 'HEAD' }).catch(() => null);
      if (!y?.ok) eksik++;
    }
  }
  yaz(eksik ? 'kotu' : 'iyi', `Harita yazı tipleri: ${16 - eksik}/16`,
    eksik ? 'Eksik dosya var — haritada yer adları çıkmaz.' : '');

  // 11) Gerok paketi
  try {
    const { geroklar } = await import('./js/veri.js');
    const g = await geroklar();
    yaz(g.length ? 'iyi' : 'orta', `Gerok paketi: ${g.length ? g[0].ad : 'yüklenmedi'}`,
      g.length ? `${g[0].gunler?.length || 0} gün · ${g[0].duraklar?.length || 0} durak` : 'Gerok sekmesinden yükle.');
  } catch (h) { yaz('orta', 'Paket sorgulanamadı', h.message); }

  bitir();
}

function bitir() {
  const o = document.getElementById('ozet');
  o.className = kotu ? 'kotu' : 'iyi';
  o.textContent = kotu ? `${kotu} sorun var — ${iyi} madde tamam.` : `Hepsi tamam (${iyi} madde).`;
  document.getElementById('basla').textContent = 'Yeniden sına';
}

document.getElementById('basla').addEventListener('click', () => {
  sina().catch(h => yaz('kotu', 'Sınama çöktü', h.message));
});
</script>
</body>
</html>
