<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gerok">
<title>Gerok</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon/ikon-180.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/stil.css">
<script>
  // Tema, sayfa boyanmadan uygulanıyor. Modüller yüklenene kadar beklenirse
  // açılışta bir an ters renk çakıyor. Ayrıntı: js/tema.js
  try {
    var s = localStorage.getItem('gerokTema') || 'otomatik';
    document.documentElement.dataset.tema =
      (s === 'acik' || s === 'koyu') ? s
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'acik' : 'koyu');
  } catch (e) { document.documentElement.dataset.tema = 'koyu'; }
</script>
</head>
<body>

<div id="yukleniyor" class="acilis">
  <div class="acilis-ic">
    <div class="acilis-ad">Gerok</div>
    <div class="acilis-not">açılıyor…</div>
  </div>
</div>

<header id="ustBar">
  <div class="ust-sol">
    <div id="ustBaslik">Gerok</div>
    <div id="ustAlt" class="ust-alt"></div>
  </div>
  <div class="ust-sag">
    <button id="izRozet" class="rozet" title="İz kaydı">
      <span class="nokta"></span><span id="izYazi">kapalı</span>
    </button>
  </div>
</header>

<main id="govde">

  <!-- ---------- ZAMAN ÇİZGİSİ ---------- -->
  <section id="ekran-zaman" class="ekran">
    <div id="zamanListe" class="liste"></div>
  </section>

  <!-- ---------- HARİTA ---------- -->
  <section id="ekran-harita" class="ekran">
    <div id="haritaKap">
      <div id="harita"></div>
      <div id="haritaUyari" class="harita-uyari gizli"></div>
      <div id="haritaKipler" class="harita-kipler">
        <button data-kip="gunduz" class="kip secili">Gündüz</button>
        <button data-kip="gece" class="kip">Gece</button>
        <button data-kip="uydu" class="kip">Uydu</button>
      </div>
      <div id="haritaKaynak" class="harita-kaynak">© OpenStreetMap</div>
      <!-- Durak koyma nişangâhı: iğne haritanın tam ortasına konuyor -->
      <div id="haritaNisan" class="harita-nisan gizli"></div>
      <div id="haritaEkleBar" class="harita-ekle-bar gizli">
        <div class="ekle-yazi">Haritayı kaydır — durak ortadaki artının olduğu yere konacak.</div>
        <div class="ekle-dugmeler">
          <button id="durakVazgec" class="kucuk-dugme">Vazgeç</button>
          <button id="durakKoy" class="kucuk-dugme secili">Buraya durak ekle</button>
        </div>
      </div>

      <!-- Yer arama: durak koymak için haritayı elle bulmak zordu.
           Çevrimdışı çalışır — bölgenin yer adları uygulamada gömülü. -->
      <div id="haritaAramaKap" class="harita-arama gizli">
        <div class="arama-satir">
          <input id="haritaArama" class="arama-girdi" type="search"
                 placeholder="Yer ara — Struga, Kotor, Prizren…"
                 autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button id="aramaKapat" class="kucuk-dugme">Kapat</button>
        </div>
        <div id="aramaSonuc" class="arama-sonuc"></div>
      </div>

      <div class="harita-dugmeler">
        <button id="haritaAra" class="yuvarlak" title="Yer ara" data-ikon="buyutec" data-ikon-boy="21"></button>
        <button id="haritaDurak" class="yuvarlak" title="Durak ekle" data-ikon="raptiye" data-ikon-boy="21"></button>
        <button id="haritaBenim" class="yuvarlak" title="Konumuma git" data-ikon="nisan" data-ikon-boy="21"></button>
        <button id="haritaHepsi" class="yuvarlak" title="Tüm rotayı göster" data-ikon="genislet" data-ikon-boy="20"></button>
        <button id="haritaGoogle" class="yuvarlak" title="Google Haritalar'da aç">G</button>
      </div>
    </div>
  </section>

  <!-- ---------- KAYIT ---------- -->
  <section id="ekran-kayit" class="ekran">
    <div class="kayit-alan">
      <button id="btnSes" class="buyuk-dugme birincil">
        <span class="dugme-ikon" data-ikon="mikrofon" data-ikon-boy="28"></span>
        <span class="dugme-ad">Sesli not</span>
        <span class="dugme-alt" id="btnSesAlt">Dokun ve konuş · bitince Durdur'a bas</span>
      </button>

      <button id="btnOrtam" class="buyuk-dugme vurgu">
        <span class="dugme-ikon" data-ikon="dalga" data-ikon-boy="28"></span>
        <span class="dugme-ad">Ortam sesi</span>
        <!-- Süre artık sabit değil, basınca soruluyor. "30 saniye" yazısı
             kalsaydı seçim penceresi sürpriz olurdu. -->
        <span class="dugme-alt">Süresini sen seç · konuşma, sadece dinlet</span>
      </button>

      <div class="dugme-satir">
        <button id="btnYazi" class="orta-dugme"><span data-ikon="kalem" data-ikon-boy="22"></span>Yazı</button>
        <button id="btnIsaret" class="orta-dugme"><span data-ikon="nisan" data-ikon-boy="22"></span>Buradayım</button>
      </div>
      <div class="dugme-satir">
        <button id="btnKisi" class="orta-dugme"><span data-ikon="kisi" data-ikon-boy="22"></span>Tanıştık</button>
        <button id="btnFiyat" class="orta-dugme"><span data-ikon="fis" data-ikon-boy="22"></span>Harcama</button>
      </div>
      <div class="dugme-satir">
        <button id="btnFoto" class="orta-dugme genis"><span data-ikon="gorsel" data-ikon-boy="22"></span>Fotoğraf ekle</button>
      </div>

      <div id="kayitDurum" class="kayit-durum"></div>
    </div>
  </section>

  <!-- ---------- DURAKLAR ---------- -->
  <section id="ekran-duraklar" class="ekran">
    <div class="yol-modu-kap">
      <button id="btnYolModu" class="yol-modu">
        <span class="yol-ad">Yol Modu</span>
        <span class="yol-alt">Ekran açık kalır, durağa yaklaşınca uyarır</span>
      </button>
    </div>
    <div id="duraklarListe" class="liste"></div>
  </section>

  <!-- ---------- GEROK ---------- -->
  <section id="ekran-gerok" class="ekran">
    <div id="gerokPanel" class="panel-alan"></div>
  </section>

</main>

<nav id="altBar">
  <button data-ekran="zaman"    class="sekme secili"><span data-ikon="saat" data-ikon-boy="21"></span>Zaman</button>
  <button data-ekran="harita"   class="sekme"><span data-ikon="harita" data-ikon-boy="21"></span>Harita</button>
  <button data-ekran="kayit"    class="sekme buyuk"><span data-ikon="arti" data-ikon-boy="20"></span>Kayıt</button>
  <button data-ekran="duraklar" class="sekme"><span data-ikon="raptiye" data-ikon-boy="21"></span>Duraklar</button>
  <button data-ekran="gerok"    class="sekme"><span data-ikon="ayarlar" data-ikon-boy="21"></span>Gerok</button>
</nav>

<!-- Hangi sekmede olursan ol görünen bildirim şeridi -->
<div id="bildirim" class="bildirim gizli"></div>

<!-- Örtü katmanı: kayıt yaparken, Gün Sonu akışında, uyarılarda kullanılıyor -->
<div id="ortu" class="ortu gizli">
  <div id="ortuIc" class="ortu-ic"></div>
</div>

<!-- Ses kaydı sırasında ekranı kaplayan geri bildirim -->
<div id="sesKatman" class="ses-katman gizli">
  <div class="ses-halka"><div id="sesSure">0:00</div></div>
  <div id="sesIpucu" class="ses-ipucu">Kaydediliyor…</div>
  <div class="ses-dugmeler">
    <!-- Duraklat: rehber ara verince kayıt da beklesin, sonra AYNI dosyada
         devam etsin. Durdurup yeniden başlamak iki ayrı kayıt üretiyordu. -->
    <button id="sesDuraklat" class="eylem-dugme">⏸ Duraklat</button>
    <button id="sesDurdur" class="eylem-dugme birincil">■ Durdur ve kaydet</button>
    <button id="sesVazgec" class="eylem-dugme">Vazgeç</button>
  </div>
</div>

<input type="file" id="fotoSecici" accept="image/*,video/*" multiple hidden>
<input type="file" id="dosyaSecici" accept=".json,application/json" hidden>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
